# Zap Entregas — vhost do nginx.
#
# ESTE ARQUIVO É UMA CÓPIA DE REFERÊNCIA. Quem vale é o da VPS, em
# /etc/nginx/sites-available/zapentregas. Ele não é aplicado por nenhum deploy
# — mexer no nginx é sempre decisão consciente. Pra aplicar:
#
#   scp nginx-zapentregas.conf root@72.61.135.4:/etc/nginx/sites-available/zapentregas
#   ssh root@72.61.135.4 'nginx -t && systemctl reload nginx'
#
# `nginx -t` testa a configuração ANTES de recarregar; se ele reclamar, nada
# muda e o site continua no ar. Nunca use `systemctl restart` aqui — o reload
# troca a configuração sem derrubar as conexões abertas.
#
# O certificado é gerenciado pelo certbot (plugin nginx, renova sozinho 2x por
# dia). Se você reescrever este arquivo, mantenha as três linhas de ssl_* como
# estão — é onde o certbot procura.

server {
    listen 80;
    server_name zapentregas.duckdns.org;

    # Nada é servido em HTTP: tudo vai pro HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zapentregas.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/zapentregas.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zapentregas.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---------------------------------------------------------------
    # Cabeçalhos de segurança.
    #
    # HSTS: depois da primeira visita, o navegador passa a ir DIRETO no
    # https, sem nem tentar o http. Fecha a brecha do motoboy que digita o
    # endereço num Wi-Fi público e tem a primeira requisição interceptada
    # antes do redirecionamento.
    # nosniff: o navegador respeita o tipo declarado do arquivo e não
    # "adivinha" que um upload é JavaScript.
    # Referrer-Policy: ao sair do site, o outro lado só recebe o domínio —
    # nunca o link com o token de rastreio ou de conferência.
    #
    # Os mesmos três cabeçalhos também saem do app (src/proxy.ts), de
    # propósito: assim continuam valendo se este arquivo for perdido numa
    # reinstalação do servidor.
    # ---------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Download do aplicativo Android (arquivo servido direto do disco).
    location /baixar/ {
        alias /opt/zap-entregas/downloads/;
        types { application/vnd.android.package-archive apk; }

        # No nginx, um add_header dentro de um location APAGA todos os de
        # cima. Por isso os três de segurança são repetidos aqui.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Disposition "attachment";
    }

    # Página de apresentação (outro container, porta 5000).
    location /landing {
        rewrite ^/landing$ /landing/ permanent;
    }

    location /landing/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O aplicativo. 127.0.0.1 (e não localhost): com "localhost" o nginx tenta
    # o IPv6 [::1]:4000 primeiro, onde o container não escuta, e a página cai.
    # Já aconteceu — foi o incidente de 06/09/2026.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Margem pra respostas lentas: buscar endereço no mapa chama o Google
        # e a VPS anda com a CPU disputada. O padrão é 60s; com 90s a tela
        # não morre com "502" enquanto o endereço ainda está sendo procurado.
        proxy_read_timeout 90s;
    }
}
