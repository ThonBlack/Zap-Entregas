<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem internet · Zap Entregas</title>
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #18181b;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            text-align: center;
        }

        .caixa {
            max-width: 22rem;
        }

        h1 {
            font-size: 22px;
            margin: 12px 0 8px;
        }

        p {
            color: #a1a1aa;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 20px;
        }

        button {
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            background: #16a34a;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="caixa">
        <div style="font-size:48px" aria-hidden="true">📴</div>
        <h1>Sem internet</h1>
        <p>
            Seu celular está sem conexão agora. Assim que o sinal voltar, toque no
            botão abaixo pra continuar.
        </p>
        <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
</body>

</html>
