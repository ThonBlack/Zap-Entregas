version: '3'
services:
  zap-entregas:
    build: .
    container_name: zap-entregas
    restart: always
    ports:
      - "4000:3000" # Map Host 4000 -> Container 3000
    volumes:
      - ./sqlite.db:/app/sqlite.db # Persist database
      - ./uploads:/app/uploads # Persist uploads if any
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/sqlite.db
      - SESSION_SECRET=${SESSION_SECRET}
      - MASTER_ADMIN_KEY=${MASTER_ADMIN_KEY}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - APP_URL=${APP_URL}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Chave do SERVIDOR (geocode + autocomplete de endereço). Não vai pro navegador.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Chave do NAVEGADOR pro mapa da conferência (Maps JavaScript API).
      # Tem que ser outra chave, restrita por site no console do Google.
      # Vazia = o mapa cai no OpenStreetMap sozinho.
      - GOOGLE_MAPS_BROWSER_KEY=${GOOGLE_MAPS_BROWSER_KEY:-}
      # Login com Google (vazio = botão nem aparece). OAUTH_BASE_URL opcional:
      # sobrescreve APP_URL na hora de montar o endereço de retorno do Google.
      - OAUTH_BASE_URL=${OAUTH_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://zapentregas.duckdns.org}
